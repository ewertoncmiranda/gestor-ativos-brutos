name: Feature → PR para Develop

on:
  push:
    branches:
      - 'feature/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.ref.replace('refs/heads/', '');
            const title = `feat: ${branchName.replace('feature/', '')}`;
            
            // Verifica se já existe PR aberta para esta branch
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branchName}`,
              state: 'open'
            });

            if (pulls.length === 0) {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                head: branchName,
                base: 'develop',
                body: `## 📝 Descrição\n\nFeature branch: **${branchName}**\n\n## 🔍 Checklist\n- [ ] Código testado localmente\n- [ ] Testes automatizados adicionados\n- [ ] Documentação atualizada`
              });

              console.log(`✅ PR criado: #${pr.number}`);
            } else {
              console.log(`ℹ️ PR já existe para esta branch: #${pulls[0].number}`);
            }
