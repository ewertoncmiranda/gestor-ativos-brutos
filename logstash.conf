input {
  tcp {
    port => 5000
    codec => json
  }
  udp {
    port => 5000
    codec => json
  }
}

filter {
  # Parse logs JSON do Spring Boot
  if [type] == "java-multiline" {
    multiline {
      pattern => "^%{TIMESTAMP_ISO8601}"
      negate => true
      what => "previous"
    }
  }

  # Extrai informações importantes
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{DATA:logger} - %{GREEDYDATA:msg}"
    }
    tag_on_failure => ["grok_failure"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-java-%{+YYYY.MM.dd}"
  }

  # Opcional: enviar para stdout também (debug)
  stdout {
    codec => rubydebug
  }
}