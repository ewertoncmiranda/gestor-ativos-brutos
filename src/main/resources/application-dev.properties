spring.application.name=gestor-ativos-brutos
server.port=${SERVER_PORT:9090}

aws.sqs.endpoint.base=${AWS_SQS_ENDPOINT_BASE:http://localstack:4566}
aws.sqs.queue.url=${AWS_SQS_QUEUE_URL:http://localstack:4566/000000000000/tratar-ativos}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:teste}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:teste}

brapi.api.key=${BRAPI_API_KEY}

# JPA / Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/minha_base?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:spring}
spring.datasource.password=${DB_PASSWORD:spring123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =====================
# ACTUATOR - Health, Metrics & Endpoints
# =====================
# Expor todos os endpoints do Actuator via HTTP
management.endpoints.web.exposure.include=health,info,metrics,mappings,env,beans

# Health check detalhado (mostra status de cada componente)
management.endpoint.health.show-details=always

# Informações da aplicação
management.info.env.enabled=true
info.app.name=gestor-ativos-brutos
info.app.description=Gestor de ativos brutos - Ecossistema B3 Monitoring
info.app.version=0.0.1-SNAPSHOT

# Métricas customizadas habilitadas
management.metrics.tags.application=${spring.application.name}

gemini.api.key=${GEMINI_API_KEY}



