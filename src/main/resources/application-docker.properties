brapi.api.key=${BRAPI_API_KEY:}
server.port=${SERVER_PORT:9090}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:3000}

# A imagem aceita qualquer endereço de banco, sem guardar usuário/senha no artefato.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=false

# LocalStack pode ser usado em desenvolvimento; endpoint vazio usa a AWS padrão.
aws.sqs.endpoint.base=${AWS_SQS_ENDPOINT_BASE:}
aws.sqs.queue.url=${AWS_SQS_QUEUE_URL:http://localstack:4566/000000000000/tratar-ativos}
aws.sqs.historical-series.queue.url=${AWS_SQS_HISTORICAL_SERIES_QUEUE_URL:http://localstack:4566/000000000000/sqs-registrar-series-historicas}
aws.region=${AWS_REGION:sa-east-1}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never

# URL base do serviço insider-ia (SIM-GES-5b)
insider.ia.url=${INSIDER_IA_URL:http://insider-ia:8080}
