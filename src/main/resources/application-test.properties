
spring.application.name=gestor-ativos-brutos
server.port=${SERVER_PORT:9091}

aws.sqs.endpoint.base=${AWS_SQS_ENDPOINT_BASE:http://localhost:4566}
aws.sqs.queue.url=${AWS_SQS_QUEUE_URL:http://localhost:4566/000000000000/tratar-ativos}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:teste}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:teste}

brapi.api.key=${BRAPI_API_KEY}

# Disable DataSource auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Optional DB configuration (populated from environment for tests that enable DB)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minha_base?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:spring}
spring.datasource.password=${DB_PASSWORD:spring123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
